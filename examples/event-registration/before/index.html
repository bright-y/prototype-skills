<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>周末小聚 · 活动报名</title>
  <style>
:root {
  color-scheme: light;
  --ink: #192d2b;
  --muted: #586a66;
  --accent: #145b4a;
  --line: #d8e2dc;
  --paper: #f6f8f4;
  --soft: #e6eee7;
  --error: #a12e28;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 5px; }
button, input { font: inherit; }
button, a, input { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .65; }
:focus-visible { outline: 3px solid #a87912; outline-offset: 4px; }
.skip { position: absolute; left: 20px; top: -80px; z-index: 5; padding: 10px 16px; background: white; }
.skip:focus { top: 10px; }
.site-header, main, .site-footer { width: min(1120px, calc(100% - 80px)); margin-inline: auto; }
.site-header { height: 88px; display: flex; align-items: center; gap: 36px; border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-size: 20px; font-weight: 750; white-space: nowrap; }
.brand-mark { display: grid; place-items: center; width: 38px; height: 38px; background: var(--accent); color: white; border-radius: 12px 3px 12px 3px; font-size: 19px; }
.header-note { font-size: 13px; color: var(--muted); }
.nav-link { margin-left: auto; font-size: 14px; text-decoration: none; white-space: nowrap; }
#booking-count { display: inline-block; margin-left: 6px; min-width: 24px; text-align: center; background: var(--soft); border-radius: 6px; }
main { min-height: calc(100dvh - 180px); padding-block: 55px 64px; }
main:focus { outline: none; }
.eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 13px; font-weight: 650; }
h1, h2, h3, p { overflow-wrap: anywhere; }
h1 { margin: 0 0 18px; font-size: clamp(32px, 4.3vw, 52px); line-height: 1.23; letter-spacing: -.045em; font-weight: 750; }
h2 { margin: 0 0 16px; font-size: 25px; line-height: 1.4; letter-spacing: -.03em; }
h3 { margin: 0 0 10px; font-size: 21px; line-height: 1.45; }
p { margin: 0 0 16px; }
.intro { max-width: 620px; margin-bottom: 38px; }
.intro p:last-child { color: var(--muted); font-size: 17px; }
.featured { display: grid; grid-template-columns: minmax(0, 1fr) 270px; background: white; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.event-copy { padding: 35px 38px; }
.event-type { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.event-copy h2 { font-size: 30px; margin-bottom: 12px; }
.event-copy > p { max-width: 560px; color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 20px 0 26px; padding: 0; list-style: none; color: var(--muted); font-size: 14px; }
.date-panel { padding: 34px; background: var(--soft); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.date-panel span { color: var(--accent); font-size: 14px; }
.date-panel strong { font-size: 78px; font-weight: 550; line-height: 1.15; letter-spacing: -.06em; }
.date-panel p { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 22px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: white; text-decoration: none; font-weight: 650; font-size: 14px; white-space: nowrap; transition: background .15s; }
.button:hover { background: #0b4436; }
.button.secondary { background: white; color: var(--accent); border-color: var(--line); }
.button.secondary:hover { background: var(--soft); }
.next-event { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 18px; padding: 26px 0; border-bottom: 1px solid var(--line); }
.next-event h3 { margin-bottom: 5px; font-size: 19px; }
.next-event p { margin: 0; color: var(--muted); font-size: 14px; }
.bookings { margin-top: 42px; scroll-margin-top: 24px; }
.bookings h2 { font-size: 20px; }
.empty-note { color: var(--muted); font-size: 14px; }
.booking-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.booking-item { display: flex; align-items: center; justify-content: space-between; gap: 20px; background: white; border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
.booking-item span { display: block; font-size: 13px; color: var(--muted); }
.booking-item a { flex-shrink: 0; font-size: 14px; }
.breadcrumb { display: inline-block; margin-bottom: 26px; font-size: 14px; }
.form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 60px; align-items: start; }
.form-layout h1, .success h1 { font-size: 36px; }
.lede { color: var(--muted); margin-bottom: 30px; }
form { max-width: 620px; }
.field { margin-bottom: 24px; }
label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 650; }
label span { font-weight: 400; color: var(--muted); margin-left: 6px; }
input { width: 100%; min-height: 48px; background: white; color: var(--ink); border: 1px solid #7c9087; border-radius: 8px; padding: 10px 14px; }
input::placeholder { color: #697773; opacity: 1; }
input[aria-invalid="true"] { border-color: var(--error); }
.hint { margin: 7px 0 0; font-size: 13px; color: var(--muted); }
.error { color: var(--error); font-size: 14px; margin: 7px 0 0; }
.notice { padding: 14px 18px; margin-bottom: 24px; border: 1px solid #d7b5b2; border-radius: 8px; background: #fff4f2; color: var(--error); }
.button-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 28px; }
.summary { background: var(--soft); border-radius: 12px; padding: 28px; }
.summary h2 { font-size: 20px; }
.summary p { color: var(--muted); font-size: 14px; }
.summary p:last-child { margin-bottom: 0; }
.summary hr { border: 0; border-top: 1px solid #c9d6cc; margin: 23px 0; }
.summary .summary-date { color: var(--accent); font-weight: 650; }
.site-footer { padding-block: 24px; display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
dialog { width: min(480px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 16px; color: var(--ink); background: white; box-shadow: 0 24px 80px #192d2b26; }
dialog::backdrop { background: #122c2580; }
.dialog-content { padding: 30px; }
.dialog-content h2 { font-size: 23px; }
.dialog-content > p:not(.eyebrow):not(.error) { color: var(--muted); font-size: 14px; }
.details { margin: 24px 0; }
.details div { display: grid; grid-template-columns: 85px minmax(0, 1fr); gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.details dt { color: var(--muted); font-size: 14px; }
.details dd { margin: 0; word-break: break-word; font-size: 14px; }
.success { max-width: 640px; margin: 5px auto 0; }
.success-symbol { display: grid; place-items: center; width: 60px; height: 60px; border: 1px solid #b3cbbd; border-radius: 50%; background: var(--soft); color: var(--accent); font-size: 28px; margin-bottom: 26px; }
.success-card { margin-top: 28px; background: white; padding: 12px 28px; border: 1px solid var(--line); border-radius: 12px; }
.success-card h2 { margin-top: 18px; font-size: 21px; }
.success-card .details { margin-top: 12px; }
@media (max-width: 760px) {
  .site-header, main, .site-footer { width: calc(100% - 40px); }
  .site-header { height: 76px; gap: 16px; }
  .header-note { display: none; }
  .brand { font-size: 18px; gap: 9px; }
  .brand-mark { width: 34px; height: 34px; }
  main { padding-block: 32px 40px; }
  h1 { font-size: 34px; }
  .intro { margin-bottom: 26px; }
  .intro p:last-child { font-size: 15px; }
  .featured { grid-template-columns: minmax(0, 1fr); }
  .event-copy { padding: 26px 24px; }
  .event-copy h2 { font-size: 25px; }
  .date-panel { flex-direction: row; justify-content: flex-start; align-items: baseline; gap: 10px; padding: 18px 24px; }
  .date-panel strong { font-size: 36px; }
  .date-panel p { margin: 0 0 0 auto; font-size: 12px; }
  .next-event { gap: 16px; align-items: flex-start; }
  .next-event .button { padding-inline: 15px; }
  .form-layout { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .form-layout h1, .success h1 { font-size: 30px; }
  .summary { padding: 22px; }
  .site-footer { flex-direction: column; gap: 5px; }
  .dialog-content { padding: 24px; }
  .dialog-content .button-row > button { flex: 1; padding-inline: 12px; }
  .success-card { padding-inline: 20px; }
  .booking-item { padding: 14px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

(function (D) {
  'use strict';
  D.storageKey = 'prototype-skills:event-registration:v1';
  D.createStore = function (storage) {
    function read() {
      var raw;
      try { raw = storage.getItem(D.storageKey); } catch (error) { throw new Error('当前浏览器暂时无法读取报名记录，请允许本地存储后重试。'); }
      if (raw === null) return [];
      var records;
      try { records = JSON.parse(raw); } catch (error) { throw new Error('报名记录暂时无法读取，请保留已有数据并稍后重试。'); }
      if (!Array.isArray(records) || records.some(function (row) { return !row || typeof row !== 'object' || typeof row.id !== 'string' || typeof row.eventId !== 'string'; })) {
        throw new Error('报名记录格式暂不兼容，请保留已有数据并稍后重试。');
      }
      return records;
    }
    return {
      all: read,
      find: function (id) { return read().find(function (record) { return record.id === id; }); },
      save: function (input) {
        var records = read();
        var existing = records.find(function (record) { return record.id === input.id; });
        if (existing) return existing;
        var record = { id: input.id, eventId: input.eventId, name: input.name, email: input.email, createdAt: input.createdAt };
        // Keep old records intact; adding a registration never rewrites their fields.
        try { storage.setItem(D.storageKey, JSON.stringify(records.concat([record]))); } catch (error) { throw new Error('当前浏览器暂时无法保存报名，请检查本地存储空间后重试。'); }
        return record;
      }
    };
  };
  try { D.store = D.createStore(window.localStorage); } catch (error) { D.store = null; }
})(window.WeekendDemo = window.WeekendDemo || {});

/* Source section: assets/js/dialog.js */
(function (D) {
  'use strict';
  var dialog = document.getElementById('confirmation');
  var details = document.getElementById('confirmation-details');
  var error = document.getElementById('dialog-error');
  var saveButton = document.getElementById('save-registration');
  var pending = null;
  var busy = false;
  function close() { dialog.close(); pending = null; busy = false; saveButton.disabled = false; }
  D.closeConfirmation = function () { if (dialog.open) close(); };
  D.confirmRegistration = function (eventId, values) {
    var id = window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : 'demo-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    pending = Object.assign({ id: id, eventId: eventId, createdAt: new Date().toISOString() }, values);
    error.textContent = '';
    details.innerHTML = D.details(values);
    busy = false;
    saveButton.disabled = false;
    dialog.showModal();
    document.getElementById('cancel-confirmation').focus();
  };
  // Register each listener once; page rendering never binds dialog listeners again.
  document.getElementById('cancel-confirmation').addEventListener('click', close);
  dialog.addEventListener('cancel', function (event) { event.preventDefault(); close(); });
  saveButton.addEventListener('click', function () {
    if (!pending || busy) return;
    busy = true;
    saveButton.disabled = true;
    try {
      if (!D.store) throw new Error('当前浏览器暂时无法保存报名，请允许本地存储后重试。');
      var record = D.store.save(pending);
      close();
      window.location.hash = '#success/' + encodeURIComponent(record.id);
    } catch (problem) {
      error.textContent = '暂时没有保存成功。' + (problem.message || '请稍后重新尝试。');
      busy = false;
      saveButton.disabled = false;
    }
  });
})(window.WeekendDemo = window.WeekendDemo || {});

    return values;
  }
  function render() {
    D.closeConfirmation();
    var parts = window.location.hash.slice(1).split('/');
    var route = parts[0] || 'events';
    activeEvent = null;
    var records = [];
    var warning = '';
    try {
      if (!D.store) throw new Error('当前浏览器暂时无法使用本地存储。仍可浏览活动，报名时请换用支持本地存储的浏览器。');
      records = D.store.all();
    } catch (problem) { warning = problem.message || '报名记录暂时无法读取。'; }
    count.textContent = String(records.length);
    if (route === 'register') {
      activeEvent = D.findEvent(parts[1]);
      main.innerHTML = activeEvent ? D.renderRegistration(activeEvent, drafts[activeEvent.id] || {}, {}) : D.renderMissing();
    } else if (route === 'success') {
      var record = records.find(function (row) { return row.id === parts[1]; });
      main.innerHTML = record ? D.renderSuccess(record) : D.renderMissing();
    } else {
      main.innerHTML = D.renderEvents(records);
    }
    if (warning) main.insertAdjacentHTML('afterbegin', '<p class="notice" role="alert">' + D.escape(warning) + '</p>');
    document.title = (route === 'register' ? '填写报名信息' : route === 'success' ? '报名记录' : '周末小聚') + ' · 活动报名';
    if (route === 'bookings') {
      var bookings = document.getElementById('bookings');
      if (bookings) { bookings.scrollIntoView(); bookings.focus(); }
    } else { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  }
  main.addEventListener('input', function (event) {
    if (activeEvent && event.target.closest('#registration-form')) drafts[activeEvent.id] = valuesFrom(event.target.form);
  });
  main.addEventListener('submit', function (event) {
    if (event.target.id !== 'registration-form' || !activeEvent) return;
    event.preventDefault();
    var values = valuesFrom(event.target);
    var errors = D.validate(values);
    drafts[activeEvent.id] = values;
    if (Object.keys(errors).length) {
      main.innerHTML = D.renderRegistration(activeEvent, values, errors);
      document.getElementById('field-' + Object.keys(errors)[0]).focus();
      return;
    }
    D.fields.forEach(function (field) {
      var input = document.getElementById('field-' + field.name);
      var error = document.getElementById('error-' + field.name);
      input.setAttribute('aria-invalid', 'false');
      input.setAttribute('aria-describedby', 'hint-' + field.name);
      if (error) error.remove();
    });
    D.confirmRegistration(activeEvent.id, values);
  });
  window.addEventListener('hashchange', render);
  window.addEventListener('storage', function (event) { if (event.key === D.storageKey) render(); });
  render();
})(window.WeekendDemo = window.WeekendDemo || {});
</script>
</body>
